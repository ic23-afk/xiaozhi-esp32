name: ESP-IDF Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: build/*.bin
